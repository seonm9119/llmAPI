# Qwen2.5-7B-Instruct GGUF — llama.cpp OpenAI-compatible server
# Endpoints: /health, /v1/chat/completions
name: qwen2x5-7b

services:
  qwen2x5-7b:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: qwen2x5-7b
    restart: unless-stopped
    ports:
      - "192.168.0.21:8005:8000"
    volumes:
      - hf-cache-qwen2x5-7b:/root/.cache/llama.cpp
    networks:
      - model-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      -hf Qwen/Qwen2.5-7B-Instruct-GGUF
      --hf-file qwen2.5-7b-instruct-q4_k_m-00001-of-00002.gguf
      --host 0.0.0.0
      --port 8000
      --alias qwen2.5-7b
      --n-gpu-layers -1
      --ctx-size 4096
      --parallel 2
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 180s

  mrv-solution-api:
    build:
      context: ./mrv_solution
    container_name: qwen2x5-mrv-solution-api
    restart: unless-stopped
    ports:
      - "192.168.0.21:8006:8006"
    environment:
      QWEN_BASE_URL: http://qwen2x5-7b:8000
      QWEN_MODEL_ID: qwen2.5-7b
      QWEN_TIMEOUT_SECONDS: 180
    networks:
      - model-network
    depends_on:
      qwen2x5-7b:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/health').read()\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

networks:
  model-network:
    external: true

volumes:
  hf-cache-qwen2x5-7b:
    name: hf-cache-qwen2x5-7b
